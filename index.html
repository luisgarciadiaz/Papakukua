<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pápakukua Habit Tracker</title>
    <!-- Tailwind CSS CDN with dark mode config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <header class="bg-gray-900 text-white p-4 sticky top-0 z-10">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold">Pápakukua</h1>
            <button onclick="document.documentElement.classList.toggle('dark')" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <span id="theme-icon">🌙</span>
                <span class="hidden sm:inline">Dark Mode</span>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <section id="dashboard" class="mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                <h2 class="text-2xl font-bold mb-4">Today's Habits</h2>
                <div id="habit-list" class="space-y-3"></div>
            </div>
        </section>

        <section id="habit-list" class="mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold">Habit List</h2>
                    <button id="add-habit-btn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">+ Add Habit</button>
                </div>
                <div id="habit-list-container" class="space-y-3"></div>
            </div>
        </section>

        <section id="daily-check" class="mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                <h2 class="text-2xl font-bold mb-4">Daily Check</h2>
                <div id="daily-check-container" class="space-y-3"></div>
            </div>
        </section>

        <section id="streaks" class="mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                <h2 class="text-2xl font-bold mb-4">Streaks</h2>
                <div id="streaks-container" class="space-y-3"></div>
            </div>
        </section>
    </main>

    <footer class="text-center p-4 text-sm text-gray-500 dark:text-gray-400">
        <p>Pápakukua Habit Tracker</p>
    </footer>
</body>
</html>
